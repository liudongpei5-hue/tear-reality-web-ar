<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="用手指撕开摄像头中的现实，观看膜后面的几何空间。">
  <title>撕开现实 · Tear Reality</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090a0c'/%3E%3Cpath d='M12 17 30 27 24 52M30 27l22-14-9 29-19 10m6-25 13 15M12 17l12 35' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090a0c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
    #stage,#unity-canvas{position:fixed;inset:0;width:100%;height:100%}#unity-canvas{display:block;background:#090a0c;touch-action:none}
    #gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 42%,#2b3037 0,#101216 42%,#08090b 78%)}
    .panel{width:min(420px,100%);text-align:center}.mark{width:74px;height:74px;margin:0 auto 24px;border:1px solid #737a84;clip-path:polygon(7% 8%,48% 23%,92% 3%,78% 54%,95% 89%,52% 78%,18% 98%,24% 54%);background:repeating-linear-gradient(31deg,transparent 0 10px,#b8bec7 11px 12px),#171a1f}
    h1{margin:0 0 10px;font-size:clamp(30px,8vw,48px);font-weight:560;letter-spacing:.04em}p{margin:0 auto 24px;max-width:31ch;color:#bdc2ca;font-size:16px;line-height:1.65}
    #enter{min-width:210px;border:1px solid #fff;border-radius:999px;padding:14px 24px;background:#f4f5f6;color:#08090b;font-weight:650;cursor:pointer}#enter:disabled{opacity:.55;cursor:wait}
    #progress{height:2px;width:min(280px,75vw);margin:22px auto 0;background:#343941;overflow:hidden;opacity:0}.bar{height:100%;width:0;background:#fff;transition:width .15s linear}
    #hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(8,9,11,.55);backdrop-filter:blur(10px);white-space:nowrap;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
    #error{position:fixed;inset:auto 16px max(16px,env(safe-area-inset-bottom));z-index:8;padding:12px 14px;border-radius:10px;background:#801f2a;display:none}
  </style>
</head>
<body>
  <main id="stage" aria-label="撕开现实互动体验">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="hint">按住并拖动，撕开现实 · R 键复原</div>
  </main>
  <section id="gate"><div class="panel">
    <div class="mark" aria-hidden="true"></div><h1>撕开现实</h1>
    <p>允许使用摄像头，然后按住画面拖动。洞口后面不是涂层，而是另一个空间。</p>
    <button id="enter" type="button">开启摄像头并进入</button><div id="progress"><div class="bar"></div></div>
  </div></section>
  <div id="error" role="alert"></div><noscript>需要启用 JavaScript 才能体验。</noscript>
  <script>
    const canvas=document.querySelector('#unity-canvas'),gate=document.querySelector('#gate'),button=document.querySelector('#enter'),progress=document.querySelector('#progress'),bar=document.querySelector('.bar'),hint=document.querySelector('#hint'),errorBox=document.querySelector('#error');
    const build='Build';
    const config={arguments:[],dataUrl:build+'/WebGL.data',frameworkUrl:build+'/WebGL.framework.js',codeUrl:build+'/WebGL.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Studio Prototype',productName:'Tear Reality',productVersion:'1.0',devicePixelRatio:/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)?1:Math.min(devicePixelRatio,1.5),showBanner(message,type){if(type==='error'){errorBox.textContent=message;errorBox.style.display='block'}}};
    function fail(message){button.disabled=false;button.textContent='重新尝试';errorBox.textContent=message;errorBox.style.display='block'}
    button.addEventListener('click',()=>{
      button.disabled=true;button.textContent='正在进入…';progress.style.opacity=1;errorBox.style.display='none';
      const script=document.createElement('script');script.src=build+'/WebGL.loader.js';
      script.onload=()=>createUnityInstance(canvas,config,p=>bar.style.width=(p*100)+'%').then(()=>{gate.style.display='none';hint.style.opacity=1;setTimeout(()=>hint.style.opacity=.25,5000);canvas.focus()}).catch(()=>fail('载入失败，请刷新页面后重试。'));
      script.onerror=()=>fail('网络载入失败，请检查连接后重试。');document.body.appendChild(script);
    },{once:true});
  </script>
</body>
</html>
